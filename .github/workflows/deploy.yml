name: Deploy LoopX to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suite
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-loopx-unit-test-32bytes
          OWNER_USERNAME: Jagan
          OWNER_BCRYPT_HASH: '$2a$10$sFUynV/deT79tr3GfqNC9.rsWB51./MSUUGhq98Y7.F5HAwFGkhj2'
          EMPLOYEE_USERNAME: 'Jagan team'
          EMPLOYEE_BCRYPT_HASH: '$2a$10$QbLPPXz3fXgyaZNRRqvij.NUwC7j14zs1lliFtVluzXuzSqnT9wYq'
        run: npm test

      - name: Build Application
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
